[build-system]
requires = ["setuptools>=75.8"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
version = "0.0.1"
authors = [
  { name="Author Name", email="email@example.com" },
]
description = "description"
readme = "README.md"
requires-python = ">=3.9.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "jsonargparse[signatures]==4.44.0",
    "librosa==0.11.0",
    "lightning==2.5.4",
    "matplotlib==3.10.8",
    "pytest==9.0.2",
    "tensorboard==2.20.0",
    "torch==2.9.1",
    # Must match torch (same CUDA wheel index as torch/torchaudio). A stale torchvision
    # (e.g. 0.19 for torch 2.4) with torch 2.9 breaks torchvision.extension and triggers
    # circular-import errors when Lightning pulls torchmetrics → torchvision.
    "torchvision==0.24.1",
    "torchcodec==0.9.1",
    "transformers==4.57.3",
    "pandas==2.3.3",
    "torchaudio==2.9.1",
    "soundfile==0.13.1",
    "praat-parselmouth",
    "Unidecode==1.4.0"
]

[tool.setuptools.package-data]
"tspeech" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://github.com/mattm458/ml-template"
"Bug Tracker" = "https://github.com/mattm458/ml-template/issues"

[project.scripts]
htmodel = "tspeech.htmodel:cli_main"
tts = "tspeech.tts:cli_main"
tts-rl = "tspeech.tts_rl:cli_main"
tts-warmstart = "tspeech.make_rl_warmstart_checkpoint:main"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "src"
testpaths = "tests"